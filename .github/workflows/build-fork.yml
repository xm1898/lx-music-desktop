name: Fork build

# 个人 fork 的编译验证：不发布、不签名，产物直接作为 Artifact 下载
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & build (linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build src code
        run: npm run build

  package-win:
    name: Package Windows x64 (setup)
    runs-on: windows-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build src code
        run: npm run build

      - name: Package Windows x64 setup
        run: npm run pack:win:setup:x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-desktop-win-x64-setup
          path: |
            build/*.exe
            build/*.7z
            build/latest.yml
          if-no-files-found: error
          retention-days: 14
